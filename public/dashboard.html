<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard - MentorMatch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">MentorMatch</a>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-light btn-sm" href="/mentors.html">Mentor</a>
      <a class="btn btn-outline-light btn-sm" href="/dashboard.html">Dashboard</a>
      <a class="btn btn-outline-light btn-sm" href="/login.html">Login</a>
      <a class="btn btn-outline-light btn-sm" href="/register.html">Registrati</a>
      <button id="btnLogout" class="btn btn-warning btn-sm">Logout</button>
    </div>
  </div>
</nav>
<div class="container py-4" style="max-width:1100px">
  <div id="who" class="mb-3"></div>

  <div id="mentorTools" class="card shadow-sm mb-3 d-none">
    <div class="card-body p-4">
      <h2 class="h5">Crea slot disponibilità</h2>
      <div class="row g-2 align-items-end">
        <div class="col-md-4">
          <label class="form-label">Inizio</label>
          <input id="start_time" type="datetime-local" class="form-control" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Fine</label>
          <input id="end_time" type="datetime-local" class="form-control" />
        </div>
        <div class="col-md-4">
          <button id="btnAddSlot" class="btn btn-primary">Aggiungi slot</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h2 class="h5">I tuoi appuntamenti</h2>
      <div id="bookings" class="mt-3"></div>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
