<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Catalogo Mentor - MentorMatch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">MentorMatch</a>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-light btn-sm" href="/mentors.html">Mentor</a>
      <a class="btn btn-outline-light btn-sm" href="/dashboard.html">Dashboard</a>
      <a class="btn btn-outline-light btn-sm" href="/login.html">Login</a>
      <a class="btn btn-outline-light btn-sm" href="/register.html">Registrati</a>
      <button id="btnLogout" class="btn btn-warning btn-sm">Logout</button>
    </div>
  </div>
</nav>
<div class="container py-4">
  <div class="card shadow-sm mb-3">
    <div class="card-body">
      <h2 class="h5 mb-3">Catalogo Mentor</h2>
      <div class="row g-2">
        <div class="col-md-3">
          <input id="sector" class="form-control" placeholder="Settore (es. IT)" />
        </div>
        <div class="col-md-3">
          <input id="language" class="form-control" placeholder="Lingua (es. EN)" />
        </div>
        <div class="col-md-3">
          <input id="minRating" class="form-control" type="number" min="0" max="5" step="0.1" placeholder="Rating minimo" />
        </div>
        <div class="col-md-3 d-flex align-items-center gap-2">
          <input id="hasAvailability" type="checkbox" class="form-check-input" />
          <label for="hasAvailability" class="form-check-label">Solo con disponibilità</label>
          <button id="btnSearch" class="btn btn-primary btn-sm ms-auto">Cerca</button>
        </div>
      </div>
    </div>
  </div>

  <div id="list" class="row g-3"></div>
</div>

<script src="/js/common.js"></script>
<script src="/js/mentors.js"></script>
</body>
</html>
