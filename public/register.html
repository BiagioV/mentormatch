<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registrati - MentorMatch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">MentorMatch</a>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-light btn-sm" href="/mentors.html">Mentor</a>
      <a class="btn btn-outline-light btn-sm" href="/dashboard.html">Dashboard</a>
      <a class="btn btn-outline-light btn-sm" href="/login.html">Login</a>
      <a class="btn btn-outline-light btn-sm" href="/register.html">Registrati</a>
      <button id="btnLogout" class="btn btn-warning btn-sm">Logout</button>
    </div>
  </div>
</nav>
<div class="container py-4" style="max-width:720px">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h2 class="h4">Registrazione</h2>
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label">Nome</label>
          <input id="name" class="form-control" placeholder="Mario Rossi" />
        </div>
        <div class="col-12">
          <label class="form-label">Email</label>
          <input id="email" class="form-control" placeholder="email@esempio.com" />
        </div>
        <div class="col-12">
          <label class="form-label">Password (min 8)</label>
          <input id="password" type="password" class="form-control" />
        </div>
        <div class="col-12">
          <label class="form-label">Ruolo</label>
          <select id="role" class="form-select">
            <option value="MENTEE">Mentee</option>
            <option value="MENTOR">Mentor</option>
          </select>
        </div>
        <div class="col-12">
          <button id="btnRegister" class="btn btn-primary">Crea account</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="/js/register.js"></script>
</body>
</html>
